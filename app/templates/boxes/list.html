{% extends "base.html" %}
{% block title %}Boxes{% endblock %}
{% block heading %}📦 Boxes{% endblock %}
{% block content %}
<div style="margin-bottom:1rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
    <input type="text" id="search" placeholder="🔍 Cari box..." style="flex:1;min-width:150px;">
    <button onclick="loadBoxes()">Cari</button>
    <select id="statusFilter" onchange="loadBoxes()">
        <option value="">Semua</option>
        <option value="identified">Identified</option>
        <option value="unidentified">Unidentified</option>
    </select>
    <select id="locFilter" onchange="loadBoxes()">
        <option value="">Semua Lokasi</option>
    </select>
</div>
<div id="boxGrid" class="grid-list"></div>
<div id="loading" style="text-align:center;color:#94a3b8;padding:2rem;">Loading...</div>

<script>
apiFetch('/api/locations').then(function (d) {
    if (!d.success) return;
    var sel = document.getElementById('locFilter');
    d.data.forEach(function (l) {
        var opt = document.createElement('option');
        opt.value = l.id;
        opt.textContent = l.name;
        sel.appendChild(opt);
    });
});

function loadBoxes() {
    var q = document.getElementById('search').value;
    var s = document.getElementById('statusFilter').value;
    var loc = document.getElementById('locFilter').value;
    var grid = document.getElementById('boxGrid');
    document.getElementById('loading').style.display = 'block';
    var url = '/api/boxes?limit=100&search=' + encodeURIComponent(q);
    if (s) url += '&status=' + s;
    if (loc) url += '&location_id=' + loc;
    apiFetch(url).then(function (d) {
        document.getElementById('loading').style.display = 'none';
        if (!d.success || d.data.length === 0) {
            grid.innerHTML = '<p style="color:#94a3b8;grid-column:1/-1;">Belum ada box.</p>';
            return;
        }
        grid.innerHTML = d.data.map(function (b) {
            var p = b.photos && b.photos[0];
            var img = p ? '<img src="/uploads/boxes/' + encodeURIComponent(b.id) + '/' + esc(p.filename) + '">' : '📦';
            var locName = b.location ? b.location.name : '';
            var cnt = b.items ? b.items.length : 0;
            var link = '/boxes/' + encodeURIComponent(b.id);
            return '<div class="item-card" onclick="location.href=\'' + link + '\'" style="cursor:pointer;">'
                + '<div class="thumb">' + img + '</div>'
                + '<div class="info">'
                + '<div class="name">' + esc(b.name || '❓ Box') + '</div>'
                + '<div class="meta">📍 ' + esc(locName) + '</div>'
                + '<div class="meta">' + cnt + ' item(s)</div>'
                + '</div></div>';
        }).join('');
    });
}
loadBoxes();
</script>
{% endblock %}
